services:
  app:
    build: .
    container_name: pytgw
    volumes:
      - ./app:/app
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "9999:8000"
    environment:
      - WORKERS=1
      - PORT=8000
      - LOG_LEVEL=info          # critical, error, warning, info, debug, trace
      - DISABLE_ACCESS_LOG=true
      - SOCKS_PROXY=           # ip:port, empty - direct connect
      - TIMEOUT=30
      - CONNECT_TIMEOUT=10
      - USER_AGENT=PYTGW/1.0
      - X_CONNECTION_ID=       # Expected X-Connection-Id header value, empty - skip validation
      - TRUSTED_PROXIES=       # Trusted proxies comma-separated allowed to set forwarded host, proto, client ip
      - MAX_CONCURRENT_REQUESTS=100
      - MAX_KEEPALIVE_CONNECTIONS=10
      - MAX_REQUEST_BODY_SIZE=20971520   # 20 MiB
      - MAX_RETRIES=2
      - RETRY_BASE_DELAY=0.5
      - RETRY_MAX_DELAY=5.0
      - ENABLE_DOCS=false                # set to true to expose /docs, /redoc, /openapi.json
      - CORS_ALLOW_ORIGINS=*             # comma-separated list or "*"
      - CORS_ALLOW_CREDENTIALS=false     # must be false when origins is "*"

    restart: always
    healthcheck:
      test: ["CMD-SHELL", "PORT=$${PORT:-8000}; curl -f http://localhost:$$PORT/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
